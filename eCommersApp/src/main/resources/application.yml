server:
  port: 8080

spring:
  application:
    name: ecommerce-app
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    drop-first: ${LIQUIBASE_DROP_FIRST:false}

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

app:
  security:
    enabled: ${SECURITY_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:secretsfhsfjhdkjngdfjkgfgjdlkfjsdkfjsd-change-me-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:30000000}
