# ---- Datasource (externalized via env vars with local defaults) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase owns the schema + seed data, so Hibernate must not touch DDL.
# Use 'validate' to confirm entities match the Liquibase schema, or 'none' to skip.
spring.jpa.hibernate.ddl-auto=none

# ---- Liquibase ----
# Behaves as a proper migration tool: tracks applied changeSets in
# DATABASECHANGELOG and runs only unapplied ones. Existing data is preserved
# across restarts. NEVER enable drop-first in any shared/real environment.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.drop-first=${LIQUIBASE_DROP_FIRST:false}

spring.jpa.show-sql=true
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ---- Security (JWT secret externalized) ----
# TEMPORARY: auth is DISABLED for local UI development. All endpoints are open.
# Set SECURITY_ENABLED=true (or change to true here) to restore JWT + roles.
app.security.enabled=${SECURITY_ENABLED:false}
app.jwt.secret=${JWT_SECRET:secretsfhsfjhdkjngdfjkgfgjdlkfjsdkfjsd-change-me-in-prod}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:30000000}

# ---- Server / docs ----
server.port=${SERVER_PORT:8080}
springdoc.swagger-ui.path=/swagger-ui.html

# ---- File uploads (category/product images) ----
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Logging ----
logging.level.mycommerce=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{36}] - %msg%n






